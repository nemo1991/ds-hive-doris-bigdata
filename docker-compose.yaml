name: ds-hive-doris-bigdata
services:
  # ==========================================
  # 1. Hive 元数据库 (PostgreSQL)
  # ==========================================
  hive-postgres:
    image: crpi-sd251gdf7qgra3xz.cn-hangzhou.personal.cr.aliyuncs.com/tiarea/postgres:15-alpine
    container_name: hive-postgres
    hostname: hive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepassword
    ports:
      - "5432:5432"
    volumes:
      - hive-postgres-data:/var/lib/postgresql/data
    networks:
      bigdata-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # 2. Hive Metastore 元数据服务
  # ==========================================
  hive-metastore:
    image: crpi-sd251gdf7qgra3xz.cn-hangzhou.personal.cr.aliyuncs.com/tiarea/hive:3.1.3
    container_name: hive-metastore
    hostname: hive-metastore
    restart: unless-stopped
    depends_on:
      hive-postgres:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "true"
    ports:
      - "9083:9083"
    volumes:
      - ./postgresql-42.6.2.jar:/opt/hive/lib/postgresql-42.6.2.jar
      - ./hive-site.xml:/opt/hive/conf/hive-site.xml
      - hive-warehouse:/opt/hive/data/warehouse
    networks:
      bigdata-net:
        ipv4_address: 172.20.0.11

  # ==========================================
  # 3. HiveServer2 (JDBC 查询入口)
  # ==========================================
  hiveserver2:
    image: crpi-sd251gdf7qgra3xz.cn-hangzhou.personal.cr.aliyuncs.com/tiarea/hive:3.1.3
    container_name: hiveserver2
    ports:
      - "10000:10000"  # JDBC 端口
      - "10002:10002"  # Web UI 端口
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
    volumes:
      - ./hive-site-hiveserver2.xml:/opt/hive/conf/hive-site.xml
      - hive-warehouse:/opt/hive/data/warehouse
    depends_on:
      - hive-metastore
    networks:
      bigdata-net:
        ipv4_address: 172.20.0.12

  # ==========================================
  # 4. Apache Doris Frontend (FE)
  # ==========================================
  doris-fe:
    image: crpi-sd251gdf7qgra3xz.cn-hangzhou.personal.cr.aliyuncs.com/tiarea/doris:fe-4.1.4
    container_name: doris-fe
    hostname: doris-fe
    restart: unless-stopped
    environment:
      - FE_SERVERS=fe1:172.20.0.20:9010
      - FE_ID=1
    ports:
      - "8030:8030"   # FE HTTP Server / Web UI
      - "9030:9030"   # MySQL Client 交互端口
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
    networks:
      bigdata-net:
        ipv4_address: 172.20.0.20

  # ==========================================
  # 5. Apache Doris Backend (BE)
  # ==========================================
  doris-be:
    image: crpi-sd251gdf7qgra3xz.cn-hangzhou.personal.cr.aliyuncs.com/tiarea/doris:be-4.1.4
    container_name: doris-be
    hostname: doris-be
    restart: unless-stopped
    depends_on:
      - doris-fe
    environment:
      - FE_SERVERS=fe1:172.20.0.20:9010
      - BE_ADDR=172.20.0.21:9050
    ports:
      - "8040:8040"   # BE Webserver
      - "9050:9050"   # Heartbeat Service
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
    networks:
      bigdata-net:
        ipv4_address: 172.20.0.21

  # ==========================================
  # 6. DolphinScheduler Standalone 调度服务
  # ==========================================
  dolphinscheduler:
    image: crpi-sd251gdf7qgra3xz.cn-hangzhou.personal.cr.aliyuncs.com/tiarea/dolphinscheduler-standalone-server:3.2.1
    container_name: dolphinscheduler
    hostname: dolphinscheduler
    restart: unless-stopped
    depends_on:
      - hiveserver2
      - doris-fe
    ports:
      - "12345:12345"   # DolphinScheduler Web UI
    networks:
      bigdata-net:
        ipv4_address: 172.20.0.30

networks:
  bigdata-net:
    name: ds-hive-doris-bigdata-net # 强制指定容器网络名称，确保无下划线
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  hive-postgres-data:
  hive-warehouse:
  doris-fe-meta:
  doris-be-storage: